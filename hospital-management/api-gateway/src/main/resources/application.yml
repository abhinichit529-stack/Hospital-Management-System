server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/patient_db?useSSL=false&serverTimezone=UTC
    username: hospital_user
    password: hospital_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Service URLs
services:
  patient-service: http://localhost:8081
  doctor-service: http://localhost:8082
  appointment-service: http://localhost:8083
  billing-service: http://localhost:8084

# JWT Config
jwt:
  secret: HospitalManagementSystemSecretKey2024VeryLongSecretKeyForJWT
  expiration: 86400000  # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
